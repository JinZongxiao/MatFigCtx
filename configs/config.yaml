# =========================================================
# MatFigCtx — global configuration
# =========================================================
# Secrets (API keys, passwords) live in .env at repo root.
# Copy .env.example → .env and fill in your values.
#
# All paths below are placeholders. Replace them with your
# actual local or HPC paths before running.
# =========================================================

# ---------- Core data paths ----------
PDF_INPUT_DIR:    "/path/to/raw_papers"
PAPER_OUTPUT_DIR: "/path/to/parsed_output"
ICT_OUTPUT_DIR:   "/path/to/evidence_chains"
SIS_OUTPUT_DIR:   "/path/to/sis_outputs"
GLOBAL_MSG_CSV:   "/path/to/global_messages.csv"

# ---------- Model paths ----------
CLASSIFIER_PATH:  "/path/to/classifier/image_classifier.pt"
VLM_MODEL_PATH:   "/path/to/Qwen3-VL-8B-Instruct"
SCIBERT_PATH:     "/path/to/SciBERT"
MATBERT_PATH:     "/path/to/MatBERT_cased"
STEELBERT_PATH:   "/path/to/SteelBERT"
GEMMA_MODEL_PATH: "/path/to/gemma-4-E2B-it"

# Registry of VLMs for benchmark / ablation
VLM_REGISTRY:
  qwen3-2b:    "/path/to/Qwen3-VL-2B-Instruct"
  qwen3-4b:    "/path/to/Qwen3-VL-4B-Instruct"
  qwen3-8b:    "/path/to/Qwen3-VL-8B-Instruct"
  internvl-2b: "/path/to/InternVL3.5-2B"
  internvl-4b: "/path/to/InternVL3.5-4B"
  internvl-8b: "/path/to/InternVL3.5-8B"

# ---------- LLM endpoints (keys from env vars) ----------
DEFAULT_LLM_PROVIDER: "ernie"

DEEPSEEK_BASE_URL: "https://api.deepseek.com"
DEEPSEEK_MODEL:    "deepseek-chat"
DEEPSEEK_API_KEY_ENV: "DEEPSEEK_API_KEY"

DASHSCOPE_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
DASHSCOPE_MODEL:    "qwen3-max"
DASHSCOPE_API_KEY_ENV: "DASHSCOPE_API_KEY"

ERNIE_BASE_URL: "https://aistudio.baidu.com/llm/lmapi/v3"
ERNIE_MODEL:    "ernie-4.5-turbo-128k-preview"
ERNIE_API_KEY_ENV: "ERNIE_API_KEY"

# ---------- Neo4j (App 2) ----------
NEO4J_URI:          "bolt://localhost:7687"
NEO4J_USER:         "neo4j"
NEO4J_PASSWORD_ENV: "NEO4J_PASSWORD"
KG_OUTPUT_JSON:     "./kg_triples.json"
AGENT_B_TOP_K:      5

# ---------- VLM inference defaults ----------
CLASS_NAMES:     ["line_plot", "xrd", "microstructure"]
IMAGE_SIZE:      512
MAX_NEW_TOKENS:  1024
TEMPERATURE:     0
SLEEP_BETWEEN_CALLS: 0.2

# ---------- Benchmark (MatCha) ----------
# Download MatCha benchmark from: https://github.com/Yaraslaut/MatCha
MATCHA_JSONL:        "/path/to/matcha_benchmark/matcha_vqa_inputs.jsonl"
MATCHA_IMG_ROOT:     "/path/to/matcha_benchmark/images"
MATCHA_EVIDENCE_DIR: "/path/to/matcha_benchmark/articles_output_extracted"
MATCHA_OUTPUT_DIR:   "/path/to/matcha_benchmark/results"
MATCHA_PLUGIN_DIR:   "/path/to/matcha_benchmark"

# ---------- Ablation experiment ----------
ABLATION_OUTPUT_DIR: "/path/to/outputs/ablation"
ABLATION_CACHE_DIR:  "/path/to/outputs/resized_images"
ABLATION_SETTINGS:
  - zero_shot
  - img_only
  - txt_only
  - full
  - wo_subfig_type
  - wo_local
  - wo_global

# ---------- Cosine / analysis ----------
COSINE_OUTPUT_DIR:   "/path/to/outputs/cosine"
ANALYSIS_OUTPUT_DIR: "/path/to/outputs/analysis"

# ---------- RAG ----------
RAG_CHROMA_PATH: "/path/to/chroma_db"
RAG_COLLECTION:  "ods_alloy_facts"
RAG_TOP_K:       5
RAG_EMBED_MODEL_PATH: "/path/to/SteelBERT"
RAG_SENTENCE_CSV: "llm_output/rewritten_sentences_with_vocab.csv"

# ---------- Fine-tuning (Gemma) ----------
FT_TRAIN_DATA:   "/path/to/finetune/train_data.json"
FT_SOURCE_CSV:   "/path/to/matcha_benchmark/matcha_qwen38b.csv"
FT_SFT_OUT:      "/path/to/finetune/checkpoints"
FT_CPT_OUT:      "/path/to/finetune/cpt_checkpoints"
FT_EVAL_OUT:     "/path/to/finetune/matcha_eval"
FT_LORA_RANK:    16
FT_LORA_ALPHA:   32
FT_LORA_DROPOUT: 0.05
FT_BATCH_SIZE:   2
FT_GRAD_ACCUM:   4
FT_LR:           2.0e-4
FT_EPOCHS:       3
FT_MAX_LEN:      512
